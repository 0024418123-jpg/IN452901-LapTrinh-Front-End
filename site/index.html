<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduHub Web - Sự kiện</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <a href="index.html">EduHub Web</a>
        </div>

        <nav class="menu">
            <a href="index.html">Trang chủ</a>
            <a href="#event-list">Sự kiện</a>
            <a href="#event-list">Đăng ký</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>
        <h1>Sự kiện sắp diễn ra</h1>

        <!-- FORM TÌM KIẾM -->
        <form id="search-form">
            <label for="keyword">Tìm sự kiện:</label>

            <input type="search"
                   id="keyword"
                   placeholder="Tìm sự kiện...">

            <button type="submit">Tìm</button>
        </form>

        <p id="status"></p>

        <!-- DANH SÁCH SỰ KIỆN -->
        <div id="event-list">

            <!-- CARD 1 -->
            <article class="event-card">
                <img src="img/event.svg"
                     alt="Workshop Git và GitHub">

                <h2>
                    <a href="event-detail.html?id=22222222-2222-4222-8222-000000000001">
                        Workshop Git & GitHub cho tân sinh viên
                    </a>
                </h2>

                <p>
                    Thời gian:
                    <time datetime="2026-09-12T08:00:00">
                        08:00, 12/09/2026
                    </time>
                </p>

                <p>Địa điểm: Phòng máy A3.201</p>
                <p>Còn 12/40 chỗ</p>
            </article>

            <!-- CARD 2 -->
            <article class="event-card">
                <img src="img/event.svg"
                     alt="Hackathon EduHub">

                <h2>
                    <a href="event-detail.html?id=22222222-2222-4222-8222-000000000004">
                        Hackathon EduHub 24 giờ
                    </a>
                </h2>

                <p>
                    Thời gian:
                    <time datetime="2026-12-19T08:00:00">
                        08:00, 19/12/2026
                    </time>
                </p>

                <p>Địa điểm: Phòng máy A3.205</p>

                <p class="sold-out">Hết chỗ</p>
            </article>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 EduHub Web</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
